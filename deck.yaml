package:
  name: "@jennifer/ngs"
  version: "0.1.0"
  description: "Streaming NGS file formats, read QC, interval arithmetic and pipeline orchestration"
  license: "LGPL-3.0-only"
  authors: ["mplx <jennifer@mplx.dev>"]
  # What the code actually reaches for:
  #   exec - streaming gzip runs `gzip -dc` through a FIFO, and `pipeline` runs
  #          external tools. Both are checked at runtime with meta.hasCapability
  #          rather than declared as a file pragma, so the parsing, interval and
  #          QC layers keep working on `jennifer-tiny`, which has neither.
  capabilities: ["exec"]
  keywords: ["bioinformatics", "ngs", "sequencing", "fastq", "genomics"]
  urls:
    deck: "https://raw.githubusercontent.com/jennifer-language/deck-ngs/main/deck.yaml"
    homepage: "https://github.com/jennifer-language/deck-ngs"
    manual: "https://jennifer-language.github.io/deck-ngs/"

#  Only the default binary is listed - `jennifer-tiny` has neither
# `exec` nor the capability probe this deck's gzip and pipeline layers need.
engines:
  jennifer: ">=0.25.0"
