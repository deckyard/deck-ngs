# Grimoire book configuration for the @deckyard/ngs deck documentation.

[book]
title = "@deckyard/ngs"
description = "Streaming NGS file formats, read QC, interval arithmetic and pipeline orchestration for Jennifer."
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "grimoire"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
repoUrl = "https://github.com/deckyard/deck-ngs"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-ngs/edit/main/docs/{path}"
footer = 'Part of <a href="https://github.com/deckyard">Deckyard</a>, community decks for <a href="https://jennifer-lang.dev/">Jennifer</a>. Rendered with <a href="https://grimoire.jennifer-lang.dev/">Grimoire</a>.'

[highlight]
enabled = true

[search]
enabled = true

[pdf]
# The book is published as a site only. Off is Grimoire's default, so this
# states it rather than changes it: `grimoire build` in CI must not spend time
# on a PDF, and must not drop one into the Pages artifact.
enabled = false
