<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">Deckyard</title>
  <rect width="256" height="256" rx="56" fill="#0e1f36"/>
  <!-- the yard: a 3x3 grid of decks, one lifted out of its slot -->
  <g>
    <rect x="56" y="66" width="40" height="40" rx="8" fill="#f4f1ea"/>
    <rect x="108" y="66" width="40" height="40" rx="8" fill="#f4f1ea"/>
    <rect x="160" y="66" width="40" height="40" rx="8" fill="none" stroke="#3a5274" stroke-width="4" stroke-dasharray="7 6"/>
    <rect x="170" y="44" width="40" height="40" rx="8" fill="#ff7a45"/>
    <rect x="56" y="118" width="40" height="40" rx="8" fill="#f4f1ea"/>
    <rect x="108" y="118" width="40" height="40" rx="8" fill="#f4f1ea"/>
    <rect x="160" y="118" width="40" height="40" rx="8" fill="#f4f1ea"/>
    <rect x="56" y="170" width="40" height="40" rx="8" fill="#f4f1ea"/>
    <rect x="108" y="170" width="40" height="40" rx="8" fill="#f4f1ea"/>
    <rect x="160" y="170" width="40" height="40" rx="8" fill="#f4f1ea"/>
  </g>
</svg>
